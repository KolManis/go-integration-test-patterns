name: integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 01 shared DB (-p=1)
            dir: 01_shared_db
            p: 1
          # Показывает, что общая БД с TRUNCATE не переносит параллельные пакеты: может упасть.
          - name: 01 shared DB (-p=2, may fail)
            dir: 01_shared_db
            p: 2
            allow_failure: true
          - name: 02 DB per package
            dir: 02_db_per_package
            p: 2
          - name: 03 unique data
            dir: 03_unique_data
            p: 2
          - name: 04 tx rollback
            dir: 04_tx_rollback
            p: 2
          - name: 05 testo
            dir: 05_testo
            p: 2
    continue-on-error: ${{ matrix.allow_failure == true }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bakery
          POSTGRES_PASSWORD: bakery
          POSTGRES_DB: bakery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bakery"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://bakery:bakery@localhost:5433/bakery?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          start=$(date +%s.%N)
          set +e
          go test -tags=integration -count=1 -p=${{ matrix.p }} ./tests/${{ matrix.dir }}/... 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          set -e
          took=$(awk "BEGIN{printf \"%.1f\", $(date +%s.%N) - $start}")
          result=$([ "$code" = 0 ] && echo "✅" || echo "❌")
          echo "| ${{ matrix.name }} | -p=${{ matrix.p }} | ${took} с | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          exit $code
